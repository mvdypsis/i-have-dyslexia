<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 319" width="640" height="319" role="img" aria-label="Draw it as a map: Put the problem in the middle, and find the knot. Steps: Put the problem in the middle, in a few words. Ask what connects to it. Draw each answer as a branch. Draw lines between branches that affect each other." font-family="Lexend, Verdana, 'Segoe UI', Arial, sans-serif">
<rect width="640" height="319" rx="18" fill="#0D1117"/>
<clipPath id="c"><rect width="640" height="100%" rx="18"/></clipPath>
<rect x="0" y="0" width="10" height="100%" fill="#7C6CF2" clip-path="url(#c)"/>
<text x="40.0" y="70.0" font-size="44" font-weight="400" fill="#E6EDF3" text-anchor="start">🗺️</text>
<text x="104.0" y="58.0" font-size="26" font-weight="700" fill="#E6EDF3" text-anchor="start">Draw it as a map</text>
<text x="104.0" y="84.0" font-size="14" font-weight="700" fill="#7C6CF2" text-anchor="start">Visualising · Connecting</text>
<text x="40.0" y="124.0" font-size="18" font-weight="600" fill="#E6EDF3" text-anchor="start">Put the problem in the middle, and find the knot.</text>
<text x="40.0" y="160.0" font-size="12" font-weight="700" fill="#9DA7B3" text-anchor="start">HOW CLAUDE USES IT</text>
<circle cx="51" cy="179" r="11" fill="#7C6CF2"/>
<text x="51.0" y="184.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="72.0" y="184.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">Put the problem in the middle, in a few words.</text>
<circle cx="51" cy="208" r="11" fill="#7C6CF2"/>
<text x="51.0" y="213.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="72.0" y="213.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">Ask what connects to it. Draw each answer as a branch.</text>
<circle cx="51" cy="237" r="11" fill="#7C6CF2"/>
<text x="51.0" y="242.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="72.0" y="242.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">Draw lines between branches that affect each other.</text>
<line x1="40" y1="267" x2="600" y2="267" stroke="#30363D"/>
<text x="40.0" y="291.0" font-size="13" font-weight="400" fill="#9DA7B3" text-anchor="start">Shared by Miguel Vicente</text>
</svg>
