<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 379" width="640" height="379" role="img" aria-label="Start from the end: Picture it done, then walk backwards. Steps: Ask the person to picture the finished result. &quot;It&#x27;s done. What do you see?&quot; Ask: &quot;What had to happen just before that?&quot; Repeat, walking backwards, until you reach something they can do today." font-family="Lexend, Verdana, 'Segoe UI', Arial, sans-serif">
<rect width="640" height="379" rx="18" fill="#0D1117"/>
<clipPath id="c"><rect width="640" height="100%" rx="18"/></clipPath>
<rect x="0" y="0" width="10" height="100%" fill="#2F8FE0" clip-path="url(#c)"/>
<text x="40.0" y="70.0" font-size="44" font-weight="400" fill="#E6EDF3" text-anchor="start">🏁</text>
<text x="104.0" y="58.0" font-size="26" font-weight="700" fill="#E6EDF3" text-anchor="start">Start from the end</text>
<text x="104.0" y="84.0" font-size="14" font-weight="700" fill="#2F8FE0" text-anchor="start">Reasoning · Imagining</text>
<text x="40.0" y="124.0" font-size="18" font-weight="600" fill="#E6EDF3" text-anchor="start">Picture it done, then walk backwards.</text>
<text x="40.0" y="160.0" font-size="12" font-weight="700" fill="#9DA7B3" text-anchor="start">HOW CLAUDE USES IT</text>
<circle cx="51" cy="179" r="11" fill="#2F8FE0"/>
<text x="51.0" y="184.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="72.0" y="184.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">Ask the person to picture the finished result. &quot;It&#x27;s done.</text>
<text x="72.0" y="205.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">What do you see?&quot;</text>
<circle cx="51" cy="229" r="11" fill="#2F8FE0"/>
<text x="51.0" y="234.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="72.0" y="234.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">Ask: &quot;What had to happen just before that?&quot;</text>
<circle cx="51" cy="258" r="11" fill="#2F8FE0"/>
<text x="51.0" y="263.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="72.0" y="263.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">Repeat, walking backwards, until you reach something they</text>
<text x="72.0" y="284.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">can do today.</text>
<line x1="40" y1="309" x2="600" y2="309" stroke="#30363D"/>
<text x="40.0" y="333.0" font-size="13" font-weight="400" fill="#9DA7B3" text-anchor="start">Inspired by the novelist John Irving, who is dyslexic and does not begin a</text>
<text x="40.0" y="351.0" font-size="13" font-weight="400" fill="#9DA7B3" text-anchor="start">novel until he knows the ending</text>
</svg>
