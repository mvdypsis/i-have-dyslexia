<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 379" width="640" height="379" role="img" aria-label="Build a model: Make the idea with your hands, then move the pieces. Steps: Ask what the parts are. Give each one a physical stand-in: a sticky note, a coin, a box on screen. Lay them out so their position means something: near, far, above, inside. Move one piece and ask what changes." font-family="Lexend, Verdana, 'Segoe UI', Arial, sans-serif">
<rect width="640" height="379" rx="18" fill="#0D1117"/>
<clipPath id="c"><rect width="640" height="100%" rx="18"/></clipPath>
<rect x="0" y="0" width="10" height="100%" fill="#7C6CF2" clip-path="url(#c)"/>
<text x="40.0" y="70.0" font-size="44" font-weight="400" fill="#E6EDF3" text-anchor="start">🧱</text>
<text x="104.0" y="58.0" font-size="26" font-weight="700" fill="#E6EDF3" text-anchor="start">Build a model</text>
<text x="104.0" y="84.0" font-size="14" font-weight="700" fill="#7C6CF2" text-anchor="start">Visualising · Reasoning</text>
<text x="40.0" y="124.0" font-size="18" font-weight="600" fill="#E6EDF3" text-anchor="start">Make the idea with your hands, then move the pieces.</text>
<text x="40.0" y="160.0" font-size="12" font-weight="700" fill="#9DA7B3" text-anchor="start">HOW CLAUDE USES IT</text>
<circle cx="51" cy="179" r="11" fill="#7C6CF2"/>
<text x="51.0" y="184.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="72.0" y="184.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">Ask what the parts are. Give each one a physical stand-in: a</text>
<text x="72.0" y="205.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">sticky note, a coin, a box on screen.</text>
<circle cx="51" cy="229" r="11" fill="#7C6CF2"/>
<text x="51.0" y="234.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="72.0" y="234.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">Lay them out so their position means something: near, far,</text>
<text x="72.0" y="255.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">above, inside.</text>
<circle cx="51" cy="279" r="11" fill="#7C6CF2"/>
<text x="51.0" y="284.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="72.0" y="284.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">Move one piece and ask what changes.</text>
<line x1="40" y1="309" x2="600" y2="309" stroke="#30363D"/>
<text x="40.0" y="333.0" font-size="13" font-weight="400" fill="#9DA7B3" text-anchor="start">Inspired by Material reasoning in The Dyslexic Advantage by Brock and</text>
<text x="40.0" y="351.0" font-size="13" font-weight="400" fill="#9DA7B3" text-anchor="start">Fernette Eide, and the clay models of the Davis method</text>
</svg>
