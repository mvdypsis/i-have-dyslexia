<text x="104.0" y="58.0" font-size="26" font-weight="700" fill="#1F2430" text-anchor="start">Read with your ears</text>
<text x="104.0" y="84.0" font-size="14" font-weight="700" fill="#E2683C" text-anchor="start">Exploring</text>
<text x="40.0" y="124.0" font-size="18" font-weight="600" fill="#1F2430" text-anchor="start">If reading is slow, listen instead.</text>
<text x="40.0" y="160.0" font-size="12" font-weight="700" fill="#5B6170" text-anchor="start">HOW CLAUDE USES IT</text>
