<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 379" width="640" height="379" role="img" aria-label="Read with your ears: If reading is slow, listen instead. Steps: Ask what needs to be read, and how long it is. Suggest a way to listen: the phone&#x27;s read-aloud, an audiobook, or a spoken summary from Claude. For a long document, Claude first gives the answer and the to-dos, then the person listens to the parts that matter." font-family="Lexend, Verdana, 'Segoe UI', Arial, sans-serif">
