<text x="51.0" y="184.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="72.0" y="184.0" font-size="15" font-weight="400" fill="#1F2430" text-anchor="start">Ask what needs to be read, and how long it is.</text>
<circle cx="51" cy="208" r="11" fill="#E2683C"/>
<text x="51.0" y="213.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="72.0" y="213.0" font-size="15" font-weight="400" fill="#1F2430" text-anchor="start">Suggest a way to listen: the phone&#x27;s read-aloud, an</text>
<text x="72.0" y="234.0" font-size="15" font-weight="400" fill="#1F2430" text-anchor="start">audiobook, or a spoken summary from Claude.</text>
<circle cx="51" cy="258" r="11" fill="#E2683C"/>
<text x="51.0" y="263.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="72.0" y="263.0" font-size="15" font-weight="400" fill="#1F2430" text-anchor="start">For a long document, Claude first gives the answer and the</text>
<text x="72.0" y="284.0" font-size="15" font-weight="400" fill="#1F2430" text-anchor="start">to-dos, then the person listens to the parts that matter.</text>
<line x1="40" y1="309" x2="600" y2="309" stroke="#D8D4CA"/>
<text x="40.0" y="333.0" font-size="13" font-weight="400" fill="#5B6170" text-anchor="start">Inspired by the Yale Center for Dyslexia and Creativity, which lists</text>
