<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 379" width="640" height="379" role="img" aria-label="Think in pictures: Turn the problem into a drawing. Steps: Ask: &quot;If this were a place or a machine, what would it look like?&quot; Turn the answer into a simple drawing or diagram. Move things in the picture to test ideas. &quot;What if this box were bigger?&quot;" font-family="Lexend, Verdana, 'Segoe UI', Arial, sans-serif">
<rect width="640" height="379" rx="18" fill="#0D1117"/>
<clipPath id="c"><rect width="640" height="100%" rx="18"/></clipPath>
<rect x="0" y="0" width="10" height="100%" fill="#7C6CF2" clip-path="url(#c)"/>
<text x="40.0" y="70.0" font-size="44" font-weight="400" fill="#E6EDF3" text-anchor="start">🖼️</text>
<text x="104.0" y="58.0" font-size="26" font-weight="700" fill="#E6EDF3" text-anchor="start">Think in pictures</text>
<text x="104.0" y="84.0" font-size="14" font-weight="700" fill="#7C6CF2" text-anchor="start">Visualising</text>
<text x="40.0" y="124.0" font-size="18" font-weight="600" fill="#E6EDF3" text-anchor="start">Turn the problem into a drawing.</text>
<text x="40.0" y="160.0" font-size="12" font-weight="700" fill="#9DA7B3" text-anchor="start">HOW CLAUDE USES IT</text>
<circle cx="51" cy="179" r="11" fill="#7C6CF2"/>
<text x="51.0" y="184.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="72.0" y="184.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">Ask: &quot;If this were a place or a machine, what would it look</text>
<text x="72.0" y="205.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">like?&quot;</text>
<circle cx="51" cy="229" r="11" fill="#7C6CF2"/>
<text x="51.0" y="234.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="72.0" y="234.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">Turn the answer into a simple drawing or diagram.</text>
<circle cx="51" cy="258" r="11" fill="#7C6CF2"/>
<text x="51.0" y="263.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="72.0" y="263.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">Move things in the picture to test ideas. &quot;What if this box</text>
<text x="72.0" y="284.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">were bigger?&quot;</text>
<line x1="40" y1="309" x2="600" y2="309" stroke="#30363D"/>
<text x="40.0" y="333.0" font-size="13" font-weight="400" fill="#9DA7B3" text-anchor="start">Inspired by Charles Schwab, who says he is real good at concepts and</text>
<text x="40.0" y="351.0" font-size="13" font-weight="400" fill="#9DA7B3" text-anchor="start">visualization, and In the Mind&#x27;s Eye by Thomas G. West</text>
</svg>
