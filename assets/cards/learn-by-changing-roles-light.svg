<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-label="Learn by changing roles: See the problem from inside someone else&#x27;s job. Steps: Ask who else touches the problem: the customer, the seller, the builder, the boss. Pick one role. Look at the problem from inside that role. Ask: &quot;What does this person see that you don&#x27;t?&quot;" font-family="Lexend, Verdana, 'Segoe UI', Arial, sans-serif">
<rect width="640" height="340" rx="18" fill="#FFFDF8"/>
<clipPath id="c"><rect width="640" height="100%" rx="18"/></clipPath>
