<text x="104.0" y="58.0" font-size="26" font-weight="700" fill="#1F2430" text-anchor="start">Train it another way</text>
<text x="104.0" y="84.0" font-size="14" font-weight="700" fill="#E2683C" text-anchor="start">Exploring · Imagining</text>
<text x="40.0" y="124.0" font-size="18" font-weight="600" fill="#1F2430" text-anchor="start">Practise the weak skill through something you enjoy.</text>
<text x="40.0" y="160.0" font-size="12" font-weight="700" fill="#5B6170" text-anchor="start">HOW CLAUDE USES IT</text>
<circle cx="51" cy="179" r="11" fill="#E2683C"/>
<text x="51.0" y="184.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="72.0" y="184.0" font-size="15" font-weight="400" fill="#1F2430" text-anchor="start">Name the skill underneath the task: memory, coordination,</text>
<text x="72.0" y="205.0" font-size="15" font-weight="400" fill="#1F2430" text-anchor="start">focus, order.</text>
<circle cx="51" cy="229" r="11" fill="#E2683C"/>
<text x="51.0" y="234.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="72.0" y="234.0" font-size="15" font-weight="400" fill="#1F2430" text-anchor="start">Find an activity that trains the same skill in a different</text>
<text x="72.0" y="255.0" font-size="15" font-weight="400" fill="#1F2430" text-anchor="start">way, often one the person enjoys.</text>
<circle cx="51" cy="279" r="11" fill="#E2683C"/>
<text x="51.0" y="284.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="72.0" y="284.0" font-size="15" font-weight="400" fill="#1F2430" text-anchor="start">Suggest it as practice, alongside the main task.</text>
