<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 361" width="640" height="361" role="img" aria-label="Train it another way: Practise the weak skill through something you enjoy. Steps: Name the skill underneath the task: memory, coordination, focus, order. Find an activity that trains the same skill in a different way, often one the person enjoys. Suggest it as practice, alongside the main task." font-family="Lexend, Verdana, 'Segoe UI', Arial, sans-serif">
<rect width="640" height="361" rx="18" fill="#FFFDF8"/>
