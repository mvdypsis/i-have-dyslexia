<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384" width="640" height="384" role="img" aria-label="Jump to the answer, then check: Trust the leap to the answer, then prove it step by step. Steps: Ask for the answer first: &quot;What does your gut say?&quot; Write it down as a claim. Work backwards together: what would have to be true for it to be right?" font-family="Lexend, Verdana, 'Segoe UI', Arial, sans-serif">
<rect width="640" height="384" rx="18" fill="#FFFDF8"/>
<clipPath id="c"><rect width="640" height="100%" rx="18"/></clipPath>
<rect x="0" y="0" width="10" height="100%" fill="#2F8FE0" clip-path="url(#c)"/>
<text x="40.0" y="70.0" font-size="44" font-weight="400" fill="#1F2430" text-anchor="start">🦘</text>
<text x="104.0" y="58.0" font-size="26" font-weight="700" fill="#1F2430" text-anchor="start">Jump to the answer, then check</text>
<text x="104.0" y="84.0" font-size="14" font-weight="700" fill="#2F8FE0" text-anchor="start">Reasoning</text>
<text x="40.0" y="124.0" font-size="18" font-weight="600" fill="#1F2430" text-anchor="start">Trust the leap to the answer, then prove it step by</text>
<text x="40.0" y="150.0" font-size="18" font-weight="600" fill="#1F2430" text-anchor="start">step.</text>
<text x="40.0" y="186.0" font-size="12" font-weight="700" fill="#5B6170" text-anchor="start">HOW CLAUDE USES IT</text>
<circle cx="51" cy="205" r="11" fill="#2F8FE0"/>
<text x="51.0" y="210.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="72.0" y="210.0" font-size="15" font-weight="400" fill="#1F2430" text-anchor="start">Ask for the answer first: &quot;What does your gut say?&quot;</text>
<circle cx="51" cy="234" r="11" fill="#2F8FE0"/>
<text x="51.0" y="239.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="72.0" y="239.0" font-size="15" font-weight="400" fill="#1F2430" text-anchor="start">Write it down as a claim.</text>
<circle cx="51" cy="263" r="11" fill="#2F8FE0"/>
<text x="51.0" y="268.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="72.0" y="268.0" font-size="15" font-weight="400" fill="#1F2430" text-anchor="start">Work backwards together: what would have to be true for it</text>
<text x="72.0" y="289.0" font-size="15" font-weight="400" fill="#1F2430" text-anchor="start">to be right?</text>
<line x1="40" y1="314" x2="600" y2="314" stroke="#D8D4CA"/>
<text x="40.0" y="338.0" font-size="13" font-weight="400" fill="#5B6170" text-anchor="start">Inspired by Charles Schwab, who says he gets to the conclusion much faster</text>
<text x="40.0" y="356.0" font-size="13" font-weight="400" fill="#5B6170" text-anchor="start">than others</text>
</svg>
