<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 379" width="640" height="379" role="img" aria-label="What is this like?: Borrow the answer from another area of life. Steps: Ask: &quot;What else does this remind you of? It can be from any area of life.&quot; Take the connection seriously. Ask how that other thing is solved. Bring that solution back and test it on the real problem." font-family="Lexend, Verdana, 'Segoe UI', Arial, sans-serif">
<rect width="640" height="379" rx="18" fill="#FFFDF8"/>
<clipPath id="c"><rect width="640" height="100%" rx="18"/></clipPath>
