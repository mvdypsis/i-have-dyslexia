<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 366" width="640" height="366" role="img" aria-label="Picture what you read: Turn what you read into images, and remember the pictures. Steps: Split the text into a few parts. One idea per part. For each part, describe one clear image the person can hold: a place, an object, a scene. Ask the person to change the image so it feels like theirs." font-family="Lexend, Verdana, 'Segoe UI', Arial, sans-serif">
<rect width="640" height="366" rx="18" fill="#0D1117"/>
<clipPath id="c"><rect width="640" height="100%" rx="18"/></clipPath>
<rect x="0" y="0" width="10" height="100%" fill="#7C6CF2" clip-path="url(#c)"/>
<text x="40.0" y="70.0" font-size="44" font-weight="400" fill="#E6EDF3" text-anchor="start">📸</text>
<text x="104.0" y="58.0" font-size="26" font-weight="700" fill="#E6EDF3" text-anchor="start">Picture what you read</text>
<text x="104.0" y="84.0" font-size="14" font-weight="700" fill="#7C6CF2" text-anchor="start">Visualising · Imagining</text>
<text x="40.0" y="124.0" font-size="18" font-weight="600" fill="#E6EDF3" text-anchor="start">Turn what you read into images, and remember the</text>
<text x="40.0" y="150.0" font-size="18" font-weight="600" fill="#E6EDF3" text-anchor="start">pictures.</text>
<text x="40.0" y="186.0" font-size="12" font-weight="700" fill="#9DA7B3" text-anchor="start">HOW CLAUDE USES IT</text>
<circle cx="51" cy="205" r="11" fill="#7C6CF2"/>
<text x="51.0" y="210.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="72.0" y="210.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">Split the text into a few parts. One idea per part.</text>
<circle cx="51" cy="234" r="11" fill="#7C6CF2"/>
<text x="51.0" y="239.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="72.0" y="239.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">For each part, describe one clear image the person can hold:</text>
<text x="72.0" y="260.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">a place, an object, a scene.</text>
<circle cx="51" cy="284" r="11" fill="#7C6CF2"/>
<text x="51.0" y="289.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="72.0" y="289.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">Ask the person to change the image so it feels like theirs.</text>
<line x1="40" y1="314" x2="600" y2="314" stroke="#30363D"/>
<text x="40.0" y="338.0" font-size="13" font-weight="400" fill="#9DA7B3" text-anchor="start">Shared by Miguel Vicente</text>
</svg>
