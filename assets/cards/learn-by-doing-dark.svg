<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 358" width="640" height="358" role="img" aria-label="Learn by doing: Try it first. Read about it only when you&#x27;re stuck. Steps: Pick the smallest real task that uses the skill. Do it together, one step at a time. Explain only what this step needs. When something breaks, look it up then, and only that." font-family="Lexend, Verdana, 'Segoe UI', Arial, sans-serif">
<rect width="640" height="358" rx="18" fill="#0D1117"/>
<clipPath id="c"><rect width="640" height="100%" rx="18"/></clipPath>
<rect x="0" y="0" width="10" height="100%" fill="#E2683C" clip-path="url(#c)"/>
<text x="40.0" y="70.0" font-size="44" font-weight="400" fill="#E6EDF3" text-anchor="start">🛠️</text>
<text x="104.0" y="58.0" font-size="26" font-weight="700" fill="#E6EDF3" text-anchor="start">Learn by doing</text>
<text x="104.0" y="84.0" font-size="14" font-weight="700" fill="#E2683C" text-anchor="start">Exploring</text>
<text x="40.0" y="124.0" font-size="18" font-weight="600" fill="#E6EDF3" text-anchor="start">Try it first. Read about it only when you&#x27;re stuck.</text>
<text x="40.0" y="160.0" font-size="12" font-weight="700" fill="#9DA7B3" text-anchor="start">HOW CLAUDE USES IT</text>
<circle cx="51" cy="179" r="11" fill="#E2683C"/>
<text x="51.0" y="184.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="72.0" y="184.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">Pick the smallest real task that uses the skill.</text>
<circle cx="51" cy="208" r="11" fill="#E2683C"/>
<text x="51.0" y="213.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="72.0" y="213.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">Do it together, one step at a time. Explain only what this</text>
<text x="72.0" y="234.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">step needs.</text>
<circle cx="51" cy="258" r="11" fill="#E2683C"/>
<text x="51.0" y="263.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="72.0" y="263.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">When something breaks, look it up then, and only that.</text>
<line x1="40" y1="288" x2="600" y2="288" stroke="#30363D"/>
<text x="40.0" y="312.0" font-size="13" font-weight="400" fill="#9DA7B3" text-anchor="start">Inspired by Jamie Oliver, who is dyslexic and says &quot;Get up and do</text>
<text x="40.0" y="330.0" font-size="13" font-weight="400" fill="#9DA7B3" text-anchor="start">something&quot;</text>
</svg>
