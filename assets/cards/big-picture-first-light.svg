<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 358" width="640" height="358" role="img" aria-label="Big picture first: See the whole before the details. Steps: Stop the details. Ask: &quot;What is this whole thing for, in one sentence?&quot; Draw the whole thing as 3 to 5 big blocks. No details yet. Ask which block matters most right now." font-family="Lexend, Verdana, 'Segoe UI', Arial, sans-serif">
<rect width="640" height="358" rx="18" fill="#FFFDF8"/>
<clipPath id="c"><rect width="640" height="100%" rx="18"/></clipPath>
<rect x="0" y="0" width="10" height="100%" fill="#7C6CF2" clip-path="url(#c)"/>
<text x="40.0" y="70.0" font-size="44" font-weight="400" fill="#1F2430" text-anchor="start">🔭</text>
<text x="104.0" y="58.0" font-size="26" font-weight="700" fill="#1F2430" text-anchor="start">Big picture first</text>
<text x="104.0" y="84.0" font-size="14" font-weight="700" fill="#7C6CF2" text-anchor="start">Visualising · Reasoning</text>
<text x="40.0" y="124.0" font-size="18" font-weight="600" fill="#1F2430" text-anchor="start">See the whole before the details.</text>
<text x="40.0" y="160.0" font-size="12" font-weight="700" fill="#5B6170" text-anchor="start">HOW CLAUDE USES IT</text>
<circle cx="51" cy="179" r="11" fill="#7C6CF2"/>
<text x="51.0" y="184.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="72.0" y="184.0" font-size="15" font-weight="400" fill="#1F2430" text-anchor="start">Stop the details. Ask: &quot;What is this whole thing for, in one</text>
<text x="72.0" y="205.0" font-size="15" font-weight="400" fill="#1F2430" text-anchor="start">sentence?&quot;</text>
<circle cx="51" cy="229" r="11" fill="#7C6CF2"/>
<text x="51.0" y="234.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="72.0" y="234.0" font-size="15" font-weight="400" fill="#1F2430" text-anchor="start">Draw the whole thing as 3 to 5 big blocks. No details yet.</text>
<circle cx="51" cy="258" r="11" fill="#7C6CF2"/>
<text x="51.0" y="263.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="72.0" y="263.0" font-size="15" font-weight="400" fill="#1F2430" text-anchor="start">Ask which block matters most right now.</text>
<line x1="40" y1="288" x2="600" y2="288" stroke="#D8D4CA"/>
<text x="40.0" y="312.0" font-size="13" font-weight="400" fill="#5B6170" text-anchor="start">Inspired by dyslexic leaders described by Fortune as focusing on the big</text>
<text x="40.0" y="330.0" font-size="13" font-weight="400" fill="#5B6170" text-anchor="start">picture</text>
</svg>
