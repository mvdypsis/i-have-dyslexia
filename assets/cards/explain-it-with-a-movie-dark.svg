<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 408" width="640" height="408" role="img" aria-label="Explain it with a movie: Explain a situation through a movie scene everyone can picture. Steps: Find the heart of the situation in one line: who wants what, and what is in the way. Pick a movie scene or a well-known image with the same shape. Ask the person if they know it. Explain the situation through the scene: who is who, and what happens next." font-family="Lexend, Verdana, 'Segoe UI', Arial, sans-serif">
<rect width="640" height="408" rx="18" fill="#0D1117"/>
<clipPath id="c"><rect width="640" height="100%" rx="18"/></clipPath>
<rect x="0" y="0" width="10" height="100%" fill="#D9579B" clip-path="url(#c)"/>
<text x="40.0" y="70.0" font-size="44" font-weight="400" fill="#E6EDF3" text-anchor="start">🎞️</text>
<text x="104.0" y="58.0" font-size="26" font-weight="700" fill="#E6EDF3" text-anchor="start">Explain it with a movie</text>
<text x="104.0" y="84.0" font-size="14" font-weight="700" fill="#D9579B" text-anchor="start">Imagining · Communicating</text>
<text x="40.0" y="124.0" font-size="18" font-weight="600" fill="#E6EDF3" text-anchor="start">Explain a situation through a movie scene everyone</text>
<text x="40.0" y="150.0" font-size="18" font-weight="600" fill="#E6EDF3" text-anchor="start">can picture.</text>
<text x="40.0" y="186.0" font-size="12" font-weight="700" fill="#9DA7B3" text-anchor="start">HOW CLAUDE USES IT</text>
<circle cx="51" cy="205" r="11" fill="#D9579B"/>
<text x="51.0" y="210.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="72.0" y="210.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">Find the heart of the situation in one line: who wants what,</text>
<text x="72.0" y="231.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">and what is in the way.</text>
<circle cx="51" cy="255" r="11" fill="#D9579B"/>
<text x="51.0" y="260.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="72.0" y="260.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">Pick a movie scene or a well-known image with the same</text>
<text x="72.0" y="281.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">shape. Ask the person if they know it.</text>
<circle cx="51" cy="305" r="11" fill="#D9579B"/>
<text x="51.0" y="310.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="72.0" y="310.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">Explain the situation through the scene: who is who, and</text>
<text x="72.0" y="331.0" font-size="15" font-weight="400" fill="#E6EDF3" text-anchor="start">what happens next.</text>
<line x1="40" y1="356" x2="600" y2="356" stroke="#30363D"/>
<text x="40.0" y="380.0" font-size="13" font-weight="400" fill="#9DA7B3" text-anchor="start">Shared by Miguel Vicente</text>
</svg>
