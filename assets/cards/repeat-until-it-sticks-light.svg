<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 361" width="640" height="361" role="img" aria-label="Repeat until it sticks: Go over it again, a different way each time. Steps: Say it plainly: going over it many times is a method, not a weakness. Break the thing into small pieces. Go over one piece several times, in a different way each time: read it, say it, draw it, use it." font-family="Lexend, Verdana, 'Segoe UI', Arial, sans-serif">
<rect width="640" height="361" rx="18" fill="#FFFDF8"/>
<clipPath id="c"><rect width="640" height="100%" rx="18"/></clipPath>
<rect x="0" y="0" width="10" height="100%" fill="#2F8FE0" clip-path="url(#c)"/>
<text x="40.0" y="70.0" font-size="44" font-weight="400" fill="#1F2430" text-anchor="start">🔁</text>
<text x="104.0" y="58.0" font-size="26" font-weight="700" fill="#1F2430" text-anchor="start">Repeat until it sticks</text>
<text x="104.0" y="84.0" font-size="14" font-weight="700" fill="#2F8FE0" text-anchor="start">Reasoning</text>
<text x="40.0" y="124.0" font-size="18" font-weight="600" fill="#1F2430" text-anchor="start">Go over it again, a different way each time.</text>
<text x="40.0" y="160.0" font-size="12" font-weight="700" fill="#5B6170" text-anchor="start">HOW CLAUDE USES IT</text>
<circle cx="51" cy="179" r="11" fill="#2F8FE0"/>
<text x="51.0" y="184.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="72.0" y="184.0" font-size="15" font-weight="400" fill="#1F2430" text-anchor="start">Say it plainly: going over it many times is a method, not a</text>
<text x="72.0" y="205.0" font-size="15" font-weight="400" fill="#1F2430" text-anchor="start">weakness.</text>
<circle cx="51" cy="229" r="11" fill="#2F8FE0"/>
<text x="51.0" y="234.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="72.0" y="234.0" font-size="15" font-weight="400" fill="#1F2430" text-anchor="start">Break the thing into small pieces.</text>
<circle cx="51" cy="258" r="11" fill="#2F8FE0"/>
<text x="51.0" y="263.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="72.0" y="263.0" font-size="15" font-weight="400" fill="#1F2430" text-anchor="start">Go over one piece several times, in a different way each</text>
<text x="72.0" y="284.0" font-size="15" font-weight="400" fill="#1F2430" text-anchor="start">time: read it, say it, draw it, use it.</text>
<line x1="40" y1="309" x2="600" y2="309" stroke="#D8D4CA"/>
<text x="40.0" y="333.0" font-size="13" font-weight="400" fill="#5B6170" text-anchor="start">Shared by Miguel Vicente</text>
</svg>
