<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-label="Demo of a working day with i-have-dyslexia. An engineer stuck on failing tests gets Jump to the answer, then check. A product manager's 60-message thread becomes one answer and one action. A founder cutting costs draws a map, names the knot, and gets one first step. End card: 25 ways dyslexic people think, for anyone who gets stuck." font-family="Lexend, Verdana, 'Segoe UI', Arial, sans-serif">
