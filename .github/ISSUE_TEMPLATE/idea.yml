name: I have an idea
description: Something Claude should do for dyslexic people.
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: Thank you. Spelling does not matter here.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      placeholder: "Claude could read back my email before sending."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Who would it help, and how? (optional)
