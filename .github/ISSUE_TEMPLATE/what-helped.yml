name: It helped
description: Claude did something that worked for you.
labels: ["community-report", "helped"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Spelling does not matter here.
        Please remove any private information.
  - type: textarea
    id: what
    attributes:
      label: What did Claude do?
      placeholder: "It showed me only the next 3 steps."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why did it help?
      placeholder: "I didn't feel lost."
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example (optional)
      description: Paste what Claude wrote.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Reading Claude's answers
        - Writing with Claude
        - Pictures and diagrams
        - Planning and steps
        - Something else
