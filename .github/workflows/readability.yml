name: readability

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-readability.py
      - name: Pictures, website data and generated tables are up to date
        run: python3 tools/build-visuals.py --check
